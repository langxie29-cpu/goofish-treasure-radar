name: Android APK
on:
  push:
    branches: [main]
    paths: ['web-ui/**', '.github/workflows/android.yml', 'tests/mobile/**']
  pull_request:
    paths: ['web-ui/**', '.github/workflows/android.yml', 'tests/mobile/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui
      - run: npx playwright install --with-deps chromium
        working-directory: web-ui
      - run: npm run test:mobile
        working-directory: web-ui
      - run: npx cap sync android
        working-directory: web-ui
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: web-ui/android
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start synthetic LAN backend (no Goofish requests)
        run: python tests/mobile/mock_backend.py > /tmp/mobile-backend.log 2>&1 &
      - name: Run packaged WebView on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd web-ui/android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: |
            web-ui/android/app/build/reports/androidTests/
            web-ui/test-results/
      - name: Stage installable APK
        run: |
          mkdir -p apk
          cp web-ui/android/app/build/outputs/apk/debug/app-debug.apk apk/treasure-radar-v0.1.0-alpha-debug.apk
          sha256sum apk/*.apk > apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: treasure-radar-debug.apk
          path: apk/*
          retention-days: 90
      - name: Publish personal alpha APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.0-alpha >/dev/null 2>&1; then
            gh release create v0.1.0-alpha --target "$GITHUB_SHA" --title "Treasure Radar 0.1.0 alpha" --prerelease --notes "Personal Android debug APK. Backend stays on PC/NAS. See README Android setup. LAN HTTP is allowed only in debug builds."
          fi
          gh release upload v0.1.0-alpha apk/* --clobber
