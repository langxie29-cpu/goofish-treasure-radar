services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_DATABASE_FILE: /app/data/app.sqlite3
      RADAR_ENABLED: "true"
      SKIP_AI_ANALYSIS: "true"
      WEB_USERNAME: ${WEB_USERNAME:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD:?Set WEB_PASSWORD in .env before starting}
    volumes:
      - ./data:/app/data
      - ./state:/app/state
      - ./logs:/app/logs
      - ./images:/app/images
      - ./jsonl:/app/jsonl
      - ./price_history:/app/price_history
      - ./prompts:/app/prompts
    restart: unless-stopped
